# Include inside the orqperfume.com server block.
location = /admin { rewrite ^ /_orq_laravel/index.php last; }
location ^~ /admin/ { rewrite ^ /_orq_laravel/index.php last; }
location ^~ /api/v1/ { rewrite ^ /_orq_laravel/index.php last; }
location ^~ /livewire/ { rewrite ^ /_orq_laravel/index.php last; }
location ^~ /filament/ { rewrite ^ /_orq_laravel/index.php last; }

location = /_orq_laravel/index.php {
    internal;
    root /www/wwwroot/orq/backend/public;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_pass unix:/tmp/php-cgi-84.sock;
}

location ^~ /css/filament/ {
    root /www/wwwroot/orq/backend/public;
    try_files $uri =404;
}

location ^~ /js/filament/ {
    root /www/wwwroot/orq/backend/public;
    try_files $uri =404;
}

location ^~ /fonts/filament/ {
    root /www/wwwroot/orq/backend/public;
    try_files $uri =404;
}

location ^~ /vendor/livewire/ {
    root /www/wwwroot/orq/backend/public;
    try_files $uri =404;
}

location = /images/orq-logo-mark.png { root /www/wwwroot/orq/backend/public; }
location = /images/orq-favicon.png { root /www/wwwroot/orq/backend/public; }

location ^~ /storage/ {
    root /www/wwwroot/orq/backend/public;

    location ~ (^|/)\. { return 404; }
    location ~* \.(?:php[0-9]*|phtml|phar)(?:/|$) { return 404; }

    try_files $uri =404;
}
