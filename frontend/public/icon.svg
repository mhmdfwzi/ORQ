<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1A1714" />
      <stop offset="70%" stop-color="#0A0908" />
      <stop offset="100%" stop-color="#040404" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD2" />
      <stop offset="30%" stop-color="#ECC480" />
      <stop offset="60%" stop-color="#C4A265" />
      <stop offset="85%" stop-color="#8E6A28" />
      <stop offset="100%" stop-color="#ECC480" />
    </linearGradient>

    <!-- Subtle Gold Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECC480" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#8E6A28" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ECC480" stop-opacity="0.9" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.92  0 0 0 0 0.77  0 0 0 0 0.50  0 0 0 0.35 0"/>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Rounded Square Frame -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="10" />

  <!-- Inner Delicate Gold Inset Ring -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Top Crown / Sparkle Emblem -->
  <g transform="translate(256, 115) scale(1.1)" filter="url(#goldGlow)">
    <path d="M 0,-32 Q 5,-10 26,-5 Q 8,5 4,26 Q -5,8 -26,4 Q -8,-5 0,-32 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="-2" r="3.5" fill="#FFF" />
  </g>

  <!-- Central Monogram: ORQ -->
  <text 
    x="256" 
    y="300" 
    text-anchor="middle" 
    fill="url(#goldGrad)" 
    font-family="'Cinzel', 'Playfair Display', 'Times New Roman', 'Didot', serif" 
    font-size="148" 
    font-weight="700" 
    letter-spacing="6"
    filter="url(#goldGlow)"
  >ORQ</text>

  <!-- Subtitle: HAUTE PARFUMERIE -->
  <text 
    x="256" 
    y="355" 
    text-anchor="middle" 
    fill="url(#goldGrad)" 
    font-family="'Cinzel', 'Times New Roman', serif" 
    font-size="20" 
    font-weight="600" 
    letter-spacing="10" 
    opacity="0.9"
  >HAUTE PARFUMERIE</text>

  <!-- Bottom Accent Separator Bar -->
  <line x1="180" y1="380" x2="332" y2="380" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <circle cx="256" cy="380" r="3" fill="url(#goldGrad)" />
</svg>
